<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send us a message through our contact form.">
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="contact-card" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> WE'RE HERE TO HELP</div>
      <h1 id="page-title">Let's talk<span>.</span></h1>
      <p class="intro">Have a question or an idea? Send us a message and we'll get back to you as soon as we can.</p>
      <form id="contact-form">
        <div class="form-grid">
          <label class="field"><span>Full name <b>*</b></span>
            <input name="name" autocomplete="name" placeholder="Your name" maxlength="100" required>
          </label>
          <label class="field"><span>Email address <b>*</b></span>
            <input name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
          </label>
          <label class="field"><span>Phone number <small>(optional)</small></span>
            <input name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" maxlength="30">
          </label>
          <label class="field"><span>Subject <b>*</b></span>
            <input name="subject" placeholder="How can we help?" maxlength="200" required>
          </label>
        </div>
        <label class="field message-field"><span>Your message <b>*</b></span>
          <textarea name="message" placeholder="Tell us a little more..." rows="5" maxlength="5000" required></textarea>
          <small class="char-count" id="char-count">0 / 5000</small>
        </label>
        <div class="hp-field" aria-hidden="true">
          <label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>
        </div>
        <button id="submit-button" type="submit">
          <span id="button-label">Send message</span><span aria-hidden="true">↗</span>
        </button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
      <div class="privacy-note"><span aria-hidden="true">🔒</span> Your information is only used to respond to your message.</div>
    </section>
    <footer>CONTACT <span>•</span> WE LOOK FORWARD TO HEARING FROM YOU</footer>
  </main>
</body>
</html>
